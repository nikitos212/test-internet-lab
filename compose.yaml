services:
    app:
        build:
            context: .
        environment:
            APP_ENV: dev
            APP_SECRET: local-development-secret
            DATABASE_URL: postgresql://portfolio:portfolio@database:5432/portfolio?serverVersion=16&charset=utf8
            MAILER_DSN: smtp://mailpit:1025
            MAIL_FROM_EMAIL: noreply@portfolio.local
            CONTACT_OWNER_EMAIL: owner@portfolio.local
            OPENAI_API_KEY: ${OPENAI_API_KEY:-}
            OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.6-luna}
            CORS_ALLOW_ORIGIN: ^https?://(localhost|127\.0\.0\.1)(:[0-9]+)?$
            TRUSTED_PROXIES: 127.0.0.1
            CONTACT_RATE_LIMIT: 5
            PORTFOLIO_NAME: ${PORTFOLIO_NAME:-Михаил}
            PORT: 8080
        ports:
            - "8080:8080"
        depends_on:
            database:
                condition: service_healthy
            mailpit:
                condition: service_started
    database:
        image: postgres:16-alpine
        environment:
            POSTGRES_DB: portfolio
            POSTGRES_USER: portfolio
            POSTGRES_PASSWORD: portfolio
        ports:
            - "5432:5432"
        volumes:
            - database_data:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U portfolio -d portfolio"]
            interval: 5s
            timeout: 5s
            retries: 10
    mailpit:
        image: axllent/mailpit:v1.27
        ports:
            - "8025:8025"

volumes:
    database_data:
