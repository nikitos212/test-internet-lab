databases:
    - name: portfolio-db
      databaseName: portfolio
      user: portfolio
      plan: free
      postgresMajorVersion: '16'

services:
    - type: web
      name: portfolio-contact-api
      runtime: docker
      plan: free
      healthCheckPath: /api/health
      envVars:
          - key: APP_ENV
            value: prod
          - key: APP_SECRET
            generateValue: true
          - key: DATABASE_URL
            fromDatabase:
                name: portfolio-db
                property: connectionString
          - key: MAILER_DSN
            sync: false
          - key: MAIL_FROM_EMAIL
            sync: false
          - key: CONTACT_OWNER_EMAIL
            sync: false
          - key: OPENAI_API_KEY
            sync: false
          - key: OPENAI_MODEL
            value: gpt-5.6-luna
          - key: CORS_ALLOW_ORIGIN
            sync: false
          - key: TRUSTED_PROXIES
            value: REMOTE_ADDR
          - key: CONTACT_RATE_LIMIT
            value: 5
          - key: PORTFOLIO_NAME
            value: Михаил
