framework:
    secret: '%env(APP_SECRET)%'
    http_method_override: false
    handle_all_throwables: true
    php_errors:
        log: true
    router:
        utf8: true
    rate_limiter:
        contact:
            policy: fixed_window
            limit: '%env(int:CONTACT_RATE_LIMIT)%'
            interval: '1 minute'

when@test:
    framework:
        test: true
